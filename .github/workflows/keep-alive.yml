name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 6:00 UTC — well under Supabase's ~7-day inactivity pause window
    - cron: "0 6 */3 * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed endpoint
        run: |
          curl -sf "https://kindling-sandy.vercel.app/api/ping" || exit 1